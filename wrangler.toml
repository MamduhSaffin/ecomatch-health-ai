name = "ecomatch-health-ai"
main = "worker.ts"
compatibility_date = "2026-11-27"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx --no-install tsx scripts/precompute-worker-forecasts.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_ENV = "production"

[previews.vars]
APP_ENV = "preview"
