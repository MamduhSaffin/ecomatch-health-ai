name: EcoMatch Health AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reproducible data science pipeline
        run: python3 scripts/run_pipeline.py
      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock --no-audit --no-fund
          fi
      - name: Preserve resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: TypeScript typecheck
        run: npm run lint
      - name: Run automated Vitest suite
        run: npm test
      - name: Production Vite build
        run: npm run build
